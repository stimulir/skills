[project]
name = "scenario-simulate"
version = "0.1.0"
description = "Simulate how a described population reacts to a change — personas materialised from context, reactions fanned out through the Stimulir gateway in parallel, folded into a segment-level distribution and a narrative. Domain-agnostic and sandbox-native: httpx is the only dependency."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.5",
]
