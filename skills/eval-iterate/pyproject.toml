[project]
name = "eval-iterate"
version = "0.1.0"
description = "Advance a lab eval lineage by exactly one branch: read the tree and its prior hypotheses, derive one prompt candidate with a stated rationale, hand back the child run id. One iteration per invocation, no loop, no polling, no cross-skill invocation. Thin CLI wrapper around 'stimulir lab eval tree/derive/ack-steer'. Stdlib only, no direct REST/SDK auth."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.5",
]
